#:schema https://supabase.com/schemas/config/v1.json
# Isolated, disposable development stack. Never reset a shared database.
project_id = "yeobek-mvp"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[realtime]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "6MiB"

[storage.s3_protocol]
enabled = false

[storage.vector]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enabled = true
double_confirm_changes = true
enable_confirmations = true
otp_length = 6
# Minimum gap between confirmation mails to one address (local stack only).
max_frequency = "1s"

[auth.email.template.confirmation]
subject = "Yeobek 이메일 인증 코드"
content_path = "./supabase/templates/confirmation.html"

[edge_runtime]
enabled = false

[functions.stibee-signup-email]
verify_jwt = false
entrypoint = "./functions/stibee-signup-email/index.js"

[analytics]
enabled = false
