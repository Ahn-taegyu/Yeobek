name: App checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      VISITOR_IP_HASH_SECRET: local-ci-only-network-hmac-secret-0123456789
      FEATURE_GAPS: "false"
      FEATURE_OPS_AGGREGATION: "false"
      FEATURE_FOLLOW_UP_QUESTIONS: "true"
      FEATURE_VOICE_REQUIRED: "true"
      FEATURE_SIGNUP: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:demo:guards
      - run: npm run db:start
      - run: npm run db:test
      - run: npm run db:types
      - name: Check schema type drift
        run: git diff --exit-code -- src/lib/supabase/database.types.ts
      - run: npm run db:env
      - run: npm run build
      - name: Verify the running API
        env:
          CRON_SECRET: local-integration-only-0123456789abcdef
          TEST_CRON_SECRET: local-integration-only-0123456789abcdef
        run: |
          npm run start -- --hostname 127.0.0.1 > /tmp/yeobek-app.log 2>&1 &
          for attempt in {1..60}; do
            if curl --silent --fail http://localhost:3000/api/health > /dev/null; then
              break
            fi
            if (( attempt == 60 )); then
              echo "App health check did not become ready."
              tail -n 100 /tmp/yeobek-app.log
              exit 1
            fi
            sleep 1
          done
          npm run test:integration
      - name: Verify mock AI jobs in development mode
        env:
          AI_PROVIDER_MODE: mock
          # Local tests emulate Vercel's trusted edge with stable fixture IPs.
          VERCEL: "1"
          FEATURE_VOICE_REQUIRED: "false"
          FEATURE_GAPS: "true"
          FEATURE_EXPECTED_QA: "true"
          FEATURE_EXHIBITION_QA: "true"
          FEATURE_PREVIEW_CHAT: "true"
          FEATURE_QA_REWRITE: "true"
          CRON_SECRET: local-integration-only-0123456789abcdef
          TEST_CRON_SECRET: local-integration-only-0123456789abcdef
          APP_ORIGIN: http://localhost:3001
          TEST_APP_ORIGIN: http://localhost:3001
          CHANNEL_TALK_CHANNEL_ID: support-test-channel
          CHANNEL_TALK_WEBHOOK_TOKEN: local-support-only-0123456789abcdef
        run: |
          node node_modules/next/dist/bin/next dev --webpack --hostname 127.0.0.1 --port 3001 > /tmp/yeobek-mock.log 2>&1 &
          mock_pid=$!
          trap 'kill "$mock_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --silent --fail http://localhost:3001/api/health > /dev/null; then
              break
            fi
            if (( attempt == 60 )); then
              echo "Mock app did not become ready."
              tail -n 100 /tmp/yeobek-mock.log
              exit 1
            fi
            sleep 1
          done
          npm run test:jobs
          npm run test:publication
          npm run test:visitor
          npm run test:audio
          npm run test:automation
          npm run test:support
          npm run test:demo
          npm run test:qa
          kill "$mock_pid"
          wait "$mock_pid" || true
          FEATURE_GAPS=false FEATURE_SIGNUP=false FEATURE_EXPECTED_QA=false FEATURE_EXHIBITION_QA=false FEATURE_PREVIEW_CHAT=false FEATURE_QA_REWRITE=false node node_modules/next/dist/bin/next dev --webpack --hostname 127.0.0.1 --port 3001 > /tmp/yeobek-gaps-off.log 2>&1 &
          mock_pid=$!
          for attempt in {1..60}; do
            if curl --silent --fail http://localhost:3001/api/health > /dev/null; then
              break
            fi
            if (( attempt == 60 )); then
              tail -n 100 /tmp/yeobek-gaps-off.log
              exit 1
            fi
            sleep 1
          done
          TEST_GAPS_DISABLED_ONLY=true npm run test:visitor
          TEST_SIGNUP_DISABLED_ONLY=true node --test tests/integration/signup.test.mjs
          TEST_QA_DISABLED_ONLY=true npm run test:qa
      - name: Stop the disposable stack
        if: always()
        run: npm run db:stop
